spring.application.name=budgetPlanner
# PostgreSQL Database Configuration
spring.datasource.h2.url=jdbc:h2:mem:testdb
spring.datasource.h2.username=sa
spring.datasource.h2.password=

# JDBC Driver
spring.datasource.h2.driver-class-name=org.h2.Driver
spring.datasource.h2.database-platform = org.hibernate.dialect.H2Dialect
spring.h2.console.enabled = true
# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port = 8082


# PostgreSQL Database Configuration
spring.datasource.pgsql.url=jdbc:postgresql://localhost:5432/budgetplanner
spring.datasource.pgsql.username=postgres
spring.datasource.pgsql.password=Save@2847

# JDBC Driver
spring.datasource.pgsql.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.server.port=8082